<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castov Secret Shield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="shield-icon" aria-label="Castov Logo">
          <svg viewBox="0 0 128 128" width="24" height="24" aria-hidden="true">
            <defs>
              <clipPath id="popupLogoTopClip">
                <polygon points="-10,-10 138,-10 138,55 -10,71" />
              </clipPath>
              <clipPath id="popupLogoBotClip">
                <polygon points="-10,71 138,55 138,138 -10,138" />
              </clipPath>
            </defs>
            <path
              d="M 108,38 L 64,13 L 20,38 L 20,90 L 64,115 L 108,90"
              fill="none"
              stroke="#cbd5e1"
              stroke-width="17"
              stroke-linecap="round"
              stroke-linejoin="round"
              clip-path="url(#popupLogoTopClip)"
            />
            <path
              d="M 108,38 L 64,13 L 20,38 L 20,90 L 64,115 L 108,90"
              fill="none"
              stroke="#00b4f5"
              stroke-width="17"
              stroke-linecap="round"
              stroke-linejoin="round"
              clip-path="url(#popupLogoBotClip)"
            />
            <path
              d="M 46,45 L 67,64 L 46,83"
              fill="none"
              stroke="#00b4f5"
              stroke-width="13"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="93" cy="64" r="8.5" fill="#00b4f5" />
          </svg>
        </div>
        <div>
          <h1 class="app-title">Castov Secret Shield</h1>
          <p class="app-tagline">AI Paste Protection & Local Decoder</p>
        </div>
      </div>
      <span class="privacy-badge">Offline Only</span>
    </header>

    <!-- Stats Hero Card -->
    <section class="card stats-card">
      <div class="stat-number" id="stat-weekly-count">0</div>
      <div class="stat-label">Secrets Blocked This Week</div>
      <div class="today-breakdown" id="today-breakdown" style="display: none;"></div>
    </section>

    <!-- Main Controls -->
    <section class="card controls-card">
      <div class="control-row">
        <div>
          <div class="control-title">Shield Protection</div>
          <div class="control-desc">Intercept paste events on AI chat websites</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-master-shield" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-row">
        <div>
          <div class="control-title">Local Counters</div>
          <div class="control-desc">Count blocked types locally (never values or URLs)</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-counting" checked />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Per-Site Toggles -->
    <section class="card sites-card">
      <div class="section-heading">Protected AI Chat Websites</div>
      <div class="sites-list" id="sites-list">
        <!-- Injected via popup.ts -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <a href="https://castov.com" target="_blank" rel="noopener noreferrer" class="castov-link" id="link-castov">
        castov.com ↗
      </a>
      <span class="footer-privacy">Zero Network • Open Source</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
