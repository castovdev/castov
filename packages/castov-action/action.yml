name: 'Castov Security & Quality Scan'
description: 'Fast offline secret scanning, port checks, and environment validation for CI/CD'
author: 'Castov'
branding:
  icon: 'shield-check'
  color: 'blue'

inputs:
  command:
    description: 'Castov command to execute (e.g. scan, cidr, verify)'
    required: false
    default: 'scan'
  args:
    description: 'Arguments to pass to the Castov command (e.g. path or flags)'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Castov CLI
      shell: bash
      run: |
        npx --yes castov@1.3.3 ${{ inputs.command }} ${{ inputs.args }}
