name: Castov Automated Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-release:
    name: Verify 39 Tests, Security Scan & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Run Castov Security & Secret Scanner
        uses: ./
        with:
          path: '.'
          fail-on-secrets: 'true'

      - name: Build & Run Castov CLI + MCP Server Test Suite (39 Tests)
        working-directory: packages/castov-cli
        run: |
          npm install --ignore-scripts
          npm run build
          npm test

      - name: Build Castov TypeScript SDK
        working-directory: packages/castov-sdk
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Publish Castov CLI & MCP Server to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.NODE_AUTH_TOKEN != ''
        working-directory: packages/castov-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance || npm publish --access public

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" ./public/*.vsix --generate-notes --title "Castov $TAG_NAME"
          fi
