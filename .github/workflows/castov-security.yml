name: Castov Security & Secret Scanner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Castov Security Scanner
        uses: ./
        with:
          path: '.'
          fail-on-secrets: 'true'

      - name: Run Castov CLI & MCP Server Test Suite (39 Tests)
        run: node --test packages/castov-cli/test/cli.test.mjs

