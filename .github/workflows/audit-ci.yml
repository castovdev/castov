name: Castov Multi-Platform CI

on:
  push:
    branches: [ main, audit-hardening ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  test-cross-platform:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/castov-cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/castov-cli
        run: npm ci || npm install

      - name: Build Castov CLI
        working-directory: packages/castov-cli
        run: npm run build

      - name: Run Test Suite (Core CLI + Audit CAS-001..016)
        working-directory: packages/castov-cli
        run: npm test

      - name: Generate Sample SARIF Report
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        working-directory: packages/castov-cli
        run: npm run gen:sample

      - name: Upload SARIF to GitHub Code Scanning (Optional Verification)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: packages/castov-cli/sample/audit-report.sarif
          category: castov-audit-sample
